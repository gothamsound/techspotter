<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechSpotter</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2rem 1.25rem;
    background: #10141a;
    color: #e6e9ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  h1 span { color: #4fc08d; }
  .coming {
    max-width: 34rem;
    font-size: 1.05rem;
    line-height: 1.5;
    color: #aab3bf;
  }
  footer {
    margin-top: 2.5rem;
    font-size: 0.85rem;
    color: #78828f;
  }
</style>
</head>
<body>
  <main>
    <h1>Tech<span>Spotter</span></h1>
    <p class="coming">Drop a screenplay PDF, get the scene-by-character matrix plus Sound and Video department spotting. In build now.</p>
  </main>
  <footer>TechSpotter &mdash; all processing happens in your browser. Your script never leaves this machine.</footer>
</body>
</html>
